services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careloop
      POSTGRES_PASSWORD: careloop
      POSTGRES_DB: careloop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careloop"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: { context: ./apps/api }
    environment:
      DATABASE_URL: postgresql://careloop:careloop@postgres:5432/careloop
      JWT_SECRET: local-dev-secret-change-me-please-32ch
      PORT: 3000
      CORS_ORIGIN: http://localhost:4200
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
